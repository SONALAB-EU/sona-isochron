[project]
name = "isochron"
version = "0.1.0"
description = "Isochronous adaptation of dubbing translations with Apertus"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=1.31,<2",
    "librosa>=0.11.0",
    "py3langid==0.4.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.0",
    "soundfile>=0.14.0",
    "torch>=2.14",
    "transformers>=5.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isochron"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
